name: Keep Streamlit Alive (Ultimate Bypass)

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt màn hình ảo (Xvfb) và Thư viện
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium

      - name: Chạy mã đánh thức trên màn hình ảo
        # Lệnh xvfb-run sẽ bao bọc quá trình chạy python vào trong một màn hình ảo
        run: xvfb-run --auto-servernum python keep_alive.py
